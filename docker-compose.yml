services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bilito-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - bilito-sqlserver-data:/var/opt/mssql

volumes:
  bilito-sqlserver-data:
